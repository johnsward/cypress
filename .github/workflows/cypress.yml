name: Cypress Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  component-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run component tests
        uses: cypress-io/github-action@v6
        with:
          component: true
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: component-test-screenshots
          path: cypress/screenshots

  e2e-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run e2e tests
        uses: cypress-io/github-action@v6
        with:
          start: npm run dev
          wait-on: "http://localhost:5173"
          browser: chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-screenshots
          path: cypress/screenshots
